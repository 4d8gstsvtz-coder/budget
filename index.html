<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><title>Мій бюджет</title><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Мій бюджет"><meta name="theme-color" content="#fbf7f4">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf7f4;--card:#fff;--tx:#3b3340;--mu:#8a8190;--pk:#f4c6d4;--pkd:#d9779a;--mn:#cdeadf;--bl:#d3e2f7;--yl:#fbebc0;--rd:#f2a5a5;--ln:#efe7e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231f27;--card:#2e2933;--tx:#f1eaf3;--mu:#a69cac;--pk:#5b3a48;--pkd:#f09bbb;--mn:#2f4f44;--bl:#34465f;--yl:#5a4d2a;--rd:#7a3d3d;--ln:#3b3541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231f27;--card:#2e2933;--tx:#f1eaf3;--mu:#a69cac;--pk:#5b3a48;--pkd:#f09bbb;--mn:#2f4f44;--bl:#34465f;--yl:#5a4d2a;--rd:#7a3d3d;--ln:#3b3541;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto;padding:16px}h1{font-size:24px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.c{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000a}
.big{font-size:30px;font-weight:700}.mu{color:var(--mu);font-size:14px}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pkd);border-radius:9px}
.al{padding:10px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;background:var(--yl)}.al.x{background:var(--rd)}
button{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:var(--pk);color:var(--tx);cursor:pointer}button.p{background:var(--pkd);color:#fff;font-weight:600}button.g{background:var(--ln)}button:disabled{opacity:.55}
input,select,textarea{font:inherit;width:100%;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:4px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;font-size:11px;padding:6px 0;color:var(--mu)}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pkd);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;font-size:30px;padding:0;box-shadow:0 4px 14px #d9779a66}
#sh{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}#sh.on{display:flex}
#sh>div{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.row{padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.tag{font-size:11px;background:var(--bl);padding:2px 8px;border-radius:9px;color:var(--tx)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--pk);border-radius:8px 8px 0 0;margin-bottom:4px}.bars .cur i{background:var(--pkd)}
#t{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;display:none;z-index:99;font-size:14px}
</style></head><body><main id="app"></main><button class="fab p" onclick="addSheet()" aria-label="Додати">+</button>
<nav id="nv"></nav><div id="sh" onclick="if(event.target==this)cl()"><div id="shc"></div></div><div id="t"></div>
<script>
var D=[["prod","🛒","Продукти"],["clo","👗","Одяг"],["sta","✏️","Канцтовари"],["toy","🧸","Іграшки"],["bab","🍼","Немовля"],["car","🚗","Машина"],["hlt","💊","Здоров’я"],["cat","🐱","Коти"],["me","💅","Особисте"],["gif","🎁","Подарунки"],["home","🏠","Дім"],["sch","🎒","Школа"],["util","💡","Комунальні"],["sub","📺","Підписки"],["fun","🎈","Розваги"],["oth","📦","Інше"]];
var KW={prod:"атб сільпо новус варус еко ашан їжа продукт",hlt:"аптека ліки лікар",cat:"корм кіт кіш",car:"wog окко бензин паливо мийка",bab:"підгузк памперс дитяч",util:"світло газ вода комунал",sub:"netflix spotify підписк",fun:"кіно кафе ресторан"};
var S=load()||{b:0,lim:{},cats:D.map(function(x){return{id:x[0],e:x[1],n:x[2]}}),ex:[],rc:[],gl:[],inc:false},tab="home",ld=0;
function load(){try{return JSON.parse(localStorage.getItem("mb1"))}catch(e){return null}}
function save(){try{localStorage.setItem("mb1",JSON.stringify(S));ld=0}catch(e){toast("Не вдалося зберегти у браузері")}}
function $(i){return document.getElementById(i)}function p2(n){return(n<10?"0":"")+n}
function td(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){return Math.round(n).toLocaleString("uk-UA")+" ₴"}
function cat(id){return S.cats.filter(function(c){return c.id==id})[0]||{e:"📦",n:"Без категорії",id:id}}
function mon(m){var a=m.split("-");return["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"][a[1]-1]+" "+a[0].slice(2)}
function sum(m,c,k){return S.ex.filter(function(x){return x.d.slice(0,7)==m&&(k=="i"?x.k=="i":x.k!="i")&&(!c||x.c==c)}).reduce(function(s,x){return s+x.a},0)}
function toast(t){var e=$("t");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2600)}
function cl(){$("sh").className=""}function sheet(h){$("shc").innerHTML=h;$("sh").className="on"}
function sel(id,v){return'<select id="'+id+'">'+S.cats.map(function(c){return'<option value="'+c.id+'"'+(c.id==v?" selected":"")+">"+c.e+" "+esc(c.n)+"</option>"}).join("")+"</select>"}
function go(t){tab=t;render()}
function render(){var T=[["home","🏠","Головна"],["hist","🧾","Історія"],["ch","📊","Графіки"],["pl","🎯","Плани"],["more","⚙️","Ще"]];
$("nv").innerHTML=T.map(function(x){return'<button class="'+(tab==x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><b>'+x[1]+"</b>"+x[2]+"</button>"}).join("");
$("app").innerHTML=V[tab]();if(tab=="hist")hl()}
var V={};
V.home=function(){var m=td().slice(0,7),sp=sum(m),b=S.b,left=b-sp,d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),dl=dim-d.getDate()+1,al="";
var pc=b?sp/b*100:0;
function warn(n,p){if(p>=100)return'<div class="al x">⛔ '+n+": ліміт використано на "+Math.round(p)+"%</div>";if(p>=90)return'<div class="al x">⚠️ '+n+": використано 90%</div>";if(p>=80)return'<div class="al">⚠️ '+n+": використано 80%</div>";return""}
if(b)al+=warn("Загальний бюджет",pc);
var rows=S.cats.map(function(c){var s=sum(m,c.id),l=S.lim[c.id]||0;if(l)al+=warn(c.e+" "+esc(c.n),s/l*100);return{c:c,s:s,l:l}}).filter(function(r){return r.s||r.l}).sort(function(a,b){return b.s-a.s});
var h="<h1>Мій бюджет 👛</h1>"+al;
h+='<div class="c"><div class="r"><span class="mu">Бюджет на місяць</span><button class="g" onclick="budSheet()">Змінити</button></div>';
if(!b)h+='<p class="mu">Бюджет ще не встановлено. Натисніть «Змінити».</p>';
else h+='<div class="big">'+money(left)+'</div><div class="mu">залишилось із '+money(b)+" · витрачено "+money(sp)+'</div><div class="bar"><i style="width:'+Math.min(100,pc)+'%"></i></div><p class="mu" style="margin:10px 0 0">Рекомендовано на день: <b>'+(left>0?money(left/dl):"0 ₴")+"</b> (залишилось днів: "+dl+")</p>";
h+="</div>";
if(S.inc){var i=sum(m,0,"i");h+='<div class="c r"><span>Доходи за місяць</span><b>'+money(i)+'</b></div><div class="c r"><span>Дохід мінус витрати</span><b>'+money(i-sp)+"</b></div>"}
h+="<h2>За категоріями</h2>";
if(!rows.length)h+='<div class="c mu">Витрат ще немає. Натисніть «+», щоб додати першу.</div>';
rows.forEach(function(r){h+='<div class="c"><div class="r"><span>'+r.c.e+" "+esc(r.c.n)+"</span><b>"+money(r.s)+"</b></div>"+(r.l?'<div class="bar"><i style="width:'+Math.min(100,r.s/r.l*100)+'%"></i></div><div class="mu">ліміт '+money(r.l)+"</div>":"")+"</div>"});
return h};
function budSheet(){sheet('<h2>Бюджет на місяць</h2><input id="bb" type="number" inputmode="decimal" value="'+(S.b||"")+'" placeholder="Сума, ₴"><button class="p" onclick="S.b=+$(\'bb\').value||0;save();cl();render()">Зберегти</button>')}
function parse(t){var o={a:"",s:"",c:"oth",d:td()},l=t.toLowerCase();
var m=t.match(/(\d+[\d\s]*[.,]?\d*)\s*(грн|₴|uah)?/i);if(m){o.a=parseFloat(m[1].replace(/\s/g,"").replace(",","."))||"";}
if(/вчора/.test(l)){var y=new Date();y.setDate(y.getDate()-1);o.d=y.getFullYear()+"-"+p2(y.getMonth()+1)+"-"+p2(y.getDate())}
var rest=t.replace(m?m[0]:"","").replace(/вчора|сьогодні/ig,"").trim();o.s=rest.split(/\s+/).slice(0,1).join(" ");
var hit=0;S.cats.forEach(function(c){if(!hit&&c.n.length>3&&l.indexOf(c.n.toLowerCase().slice(0,-1))>-1){o.c=c.id;hit=1}});
if(!hit)for(var k in KW)if(!hit&&KW[k].split(" ").some(function(w){return l.indexOf(w)>-1})){o.c=k;hit=1}
o.sure=hit;return o}
function addSheet(e){var x=e||{};sheet('<h2>'+(x.id?"Редагувати":"Нова витрата")+"</h2>"+(x.id?"":'<label class="mu">Швидкий запис текстом</label><input id="qt" placeholder="АТБ 850 грн продукти"><button class="g" onclick="fill()">Розпізнати текст</button> <button class="g" disabled>📷 Фото чека — заплановано</button><div class="mu">Перевірте поля нижче перед збереженням.</div>')+
(S.inc?'<select id="fk"><option value="e">Витрата</option><option value="i"'+(x.k=="i"?" selected":"")+">Дохід</option></select>":"")+
'<input id="fa" type="number" inputmode="decimal" placeholder="Сума, ₴" value="'+(x.a||"")+'"><input id="fd" type="date" value="'+(x.d||td())+'"><input id="fs" placeholder="Магазин / назва" value="'+esc(x.s||"")+'">'+sel("fc",x.c||"prod")+'<input id="fn" placeholder="Нотатка (необов’язково)" value="'+esc(x.t||"")+'">'+
'<button class="p" onclick="saveEx(\''+(x.id||"")+'\')">Зберегти</button> '+(x.id?'<button class="g" onclick="delEx(\''+x.id+'\')">Видалити</button>':""))}
function fill(){var o=parse($("qt").value);$("fa").value=o.a;$("fd").value=o.d;$("fs").value=o.s;$("fc").value=o.c;toast(o.sure?"Розпізнано. Перевірте поля":"Категорію не вгадано — оберіть вручну")}
var dupOK=0;function saveEx(id){var a=+$("fa").value;if(!(a>0))return toast("Вкажіть суму більше 0");
var o={id:id||uid(),a:a,d:$("fd").value||td(),s:$("fs").value.trim(),c:$("fc").value,t:$("fn").value.trim(),k:S.inc&&$("fk").value=="i"?"i":"e"};
if(!id&&!dupOK&&S.ex.some(function(x){return x.a==o.a&&x.d==o.d&&x.s==o.s&&x.k==o.k})){dupOK=1;return toast("Схожа витрата вже є. Натисніть «Зберегти» ще раз, якщо це не дублікат")}
dupOK=0;if(id)S.ex=S.ex.map(function(x){return x.id==id?o:x});else S.ex.push(o);save();cl();render()}
function delEx(id){S.ex=S.ex.filter(function(x){return x.id!=id});save();cl();render()}
V.hist=function(){var ms=[];S.ex.forEach(function(x){var m=x.d.slice(0,7);if(ms.indexOf(m)<0)ms.push(m)});ms.sort().reverse();
return'<h1>Історія</h1><input id="hq" placeholder="🔍 Пошук" oninput="hl()"><div class="r"><select id="hc" onchange="hl()"><option value="">Усі категорії</option>'+S.cats.map(function(c){return'<option value="'+c.id+'">'+c.e+" "+esc(c.n)+"</option>"}).join("")+'</select><select id="hm" onchange="hl()"><option value="">Усі місяці</option>'+ms.map(function(m){return'<option value="'+m+'">'+mon(m)+"</option>"}).join("")+'</select></div><div class="c" id="hlst"></div>'};
function hl(){var q=($("hq").value||"").toLowerCase(),c=$("hc").value,m=$("hm").value;
var L=S.ex.filter(function(x){return(!c||x.c==c)&&(!m||x.d.slice(0,7)==m)&&(!q||(x.s+" "+x.t+" "+cat(x.c).n).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return a.d<b.d?1:-1});
$("hlst").innerHTML=L.length?L.map(function(x){return'<div class="row r" onclick="addSheet(S.ex.filter(function(y){return y.id==\''+x.id+'\'})[0])"><div>'+cat(x.c).e+" "+esc(x.s||cat(x.c).n)+'<div class="mu">'+x.d.split("-").reverse().join(".")+" · "+esc(cat(x.c).n)+(x.t?" · "+esc(x.t):"")+"</div></div><b>"+(x.k=="i"?"+":"−")+money(x.a)+"</b></div>"}).join(""):'<span class="mu">Нічого не знайдено</span>'}
V.ch=function(){var n=new Date(),M=[];for(var i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1);M.push(d.getFullYear()+"-"+p2(d.getMonth()+1))}
var V6=M.map(function(m){return sum(m)}),mx=Math.max.apply(null,V6.concat([1])),cur=M[5],pv=M[4];
var h='<h1>Графіки</h1><div class="c"><div class="mu">Витрати за 6 місяців</div><div class="bars" style="margin-top:10px">'+M.map(function(m,i){return'<div class="'+(i==5?"cur":"")+'" style="align-self:flex-end"><i style="height:'+Math.max(2,V6[i]/mx*100)+'px"></i>'+mon(m).split(" ")[0]+"<br>"+(V6[i]?Math.round(V6[i]/1000*10)/10+"т":"–")+"</div>"}).join("")+"</div></div>";
h+='<div class="c"><div class="mu">Цей місяць проти минулого</div>';var any=0;
S.cats.forEach(function(c){var a=sum(cur,c.id),b=sum(pv,c.id);if(!a&&!b)return;any=1;var df=a-b;h+='<div class="row r"><span>'+c.e+" "+esc(c.n)+"</span><span>"+money(a)+' <span class="mu">('+(df>0?"+":"")+Math.round(df)+")</span></span></div>"});
return h+(any?"":'<span class="mu">Дані з’являться, коли додасте витрати.</span>')+"</div>"};
V.pl=function(){var m=td().slice(0,7),h="<h1>Плани</h1><h2>Регулярні платежі</h2>";
S.rc.forEach(function(r){var done=S.ex.some(function(x){return x.r==r.id+m});h+='<div class="c r"><div>'+cat(r.c).e+" "+esc(r.n)+'<div class="mu">'+money(r.a)+", щомісяця "+r.day+"-го</div></div><div>"+(done?"✓ додано ":'<button class="p" onclick="recAdd(\''+r.id+'\')">Додати</button> ')+'<button class="g" onclick="recDel(\''+r.id+'\')">✕</button></div></div>'});
h+='<button onclick="recSheet()">+ Регулярний платіж</button><div class="mu" style="margin-top:6px">Автоматичного списання немає: натискайте «Додати» щомісяця (повторно не додасться).</div><h2>Фінансові цілі</h2>';
S.gl.forEach(function(g){var p=g.t?Math.min(100,g.s/g.t*100):0;h+='<div class="c"><div class="r"><b>'+esc(g.n)+"</b><span>"+money(g.s)+" / "+money(g.t)+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div style="margin-top:8px"><button onclick="glAdd(\''+g.id+'\')">+ Внести</button> <button class="g" onclick="glDel(\''+g.id+'\')">Видалити</button></div></div>'});
return h+'<button onclick="glSheet()">+ Нова ціль</button>'};
function recSheet(){sheet('<h2>Регулярний платіж</h2><input id="rn" placeholder="Назва (наприклад, Інтернет)"><input id="ra" type="number" inputmode="decimal" placeholder="Сума, ₴">'+sel("rcc","util")+'<input id="rd" type="number" placeholder="День місяця (1–28)" min="1" max="28"><button class="p" onclick="recSave()">Зберегти</button>')}
function recSave(){var a=+$("ra").value;if(!$("rn").value||!(a>0))return toast("Вкажіть назву й суму");S.rc.push({id:uid(),n:$("rn").value,a:a,c:$("rcc").value,day:Math.min(28,Math.max(1,+$("rd").value||1))});save();cl();render()}
function recAdd(id){var r=S.rc.filter(function(x){return x.id==id})[0],m=td().slice(0,7);if(S.ex.some(function(x){return x.r==id+m}))return;S.ex.push({id:uid(),a:r.a,d:m+"-"+p2(r.day),s:r.n,c:r.c,t:"Регулярний платіж",k:"e",r:id+m});save();render()}
function recDel(id){S.rc=S.rc.filter(function(x){return x.id!=id});save();render()}
function glSheet(){sheet('<h2>Нова ціль</h2><input id="gn" placeholder="Назва"><input id="gt" type="number" inputmode="decimal" placeholder="Потрібна сума, ₴"><button class="p" onclick="if($(\'gn\').value&&+$(\'gt\').value>0){S.gl.push({id:uid(),n:$(\'gn\').value,t:+$(\'gt\').value,s:0});save();cl();render()}">Зберегти</button>')}
function glAdd(id){sheet('<h2>Внести на ціль</h2><input id="gv" type="number" inputmode="decimal" placeholder="Сума, ₴"><button class="p" onclick="var v=+$(\'gv\').value;S.gl.forEach(function(g){if(g.id==\''+id+'\')g.s+=v});save();cl();render()">Додати</button>')}
function glDel(id){S.gl=S.gl.filter(function(x){return x.id!=id});save();render()}
V.more=function(){var h="<h1>Ще</h1><h2>Категорії</h2><div class=\"c\">";
S.cats.forEach(function(c){h+='<div class="row r" onclick="catSheet(\''+c.id+'\')"><span>'+c.e+" "+esc(c.n)+'</span><span class="mu">'+(S.lim[c.id]?"ліміт "+money(S.lim[c.id]):"без ліміту")+"</span></div>"});
h+='</div><button onclick="catSheet()">+ Нова категорія</button><h2>Налаштування</h2><div class="c r"><span>Вести облік доходів (необов’язково)</span><input type="checkbox" style="width:24px" '+(S.inc?"checked":"")+' onchange="S.inc=this.checked;save();render()"></div>';
h+='<h2>Дані та приватність</h2><div class="c mu">Усе зберігається лише в цьому браузері на вашому пристрої. Нічого не надсилається в інтернет. Дані можуть зникнути, якщо очистити дані Safari, тому робіть резервні копії.</div><button onclick="csv()">Експорт CSV</button> <button onclick="bk()">Резервна копія</button> <button onclick="rs()">Відновити</button> <button class="g" onclick="wipe()">Стерти все</button>';
h+='<h2>Поділитися</h2><div class="c mu">Надсилається лише посилання на застосунок, ваші витрати та налаштування не передаються. Той, хто його відкриє, матиме власний окремий бюджет.</div><button class="p" onclick="shareApp()">Поділитися застосунком</button>';return h+'<h2>Заплановано</h2><div class="c mu">📷 Розпізнавання фото чеків і скриншотів — ще не реалізовано.<br>☁️ Синхронізація між пристроями — ще не реалізовано.<br>🔔 Push-сповіщення — ще не реалізовано (попередження видно в застосунку).</div>'};
function catSheet(id){var c=S.cats.filter(function(x){return x.id==id})[0]||{e:"🙂",n:"",id:""};sheet('<h2>'+(id?"Категорія":"Нова категорія")+'</h2><input id="ce" value="'+esc(c.e)+'" maxlength="4" placeholder="Емодзі"><input id="cn" value="'+esc(c.n)+'" placeholder="Назва"><input id="cl" type="number" inputmode="decimal" placeholder="Ліміт на місяць, ₴ (необов’язково)" value="'+(S.lim[id]||"")+'"><button class="p" onclick="catSave(\''+id+'\')">Зберегти</button> '+(id?'<button class="g" onclick="catDel(\''+id+'\')">Видалити</button>':""))}
function catSave(id){var n=$("cn").value.trim();if(!n)return toast("Вкажіть назву");var k=id||uid();if(id)S.cats.forEach(function(c){if(c.id==id){c.n=n;c.e=$("ce").value||"🙂"}});else S.cats.push({id:k,n:n,e:$("ce").value||"🙂"});var l=+$("cl").value;if(l>0)S.lim[k]=l;else delete S.lim[k];save();cl();render()}
function catDel(id){var u=S.ex.filter(function(x){return x.c==id}).length;if(u){S.ex.forEach(function(x){if(x.c==id)x.c="oth"});toast("Витрати ("+u+") переміщено в «Інше»")}if(id=="oth"&&S.cats.length>1){}S.cats=S.cats.filter(function(c){return c.id!=id});delete S.lim[id];if(!S.cats.some(function(c){return c.id=="oth"}))S.cats.push({id:"oth",e:"📦",n:"Інше"});save();cl();render()}
function cpu(u){try{navigator.clipboard.writeText(u).then(function(){toast("Посилання скопійовано")},function(){toast("Не вдалося скопіювати")})}catch(e){toast("Не вдалося скопіювати")}}
function shareApp(){var u=location.href;if(navigator.share){navigator.share({title:"Мій бюджет",text:"Мій бюджет — застосунок для сімейних витрат",url:u}).catch(function(e){if(!e||e.name!="AbortError")cpu(u)})}else cpu(u)}
function box(t,txt,btn){sheet("<h2>"+t+'</h2><textarea id="bx" rows="8">'+esc(txt)+"</textarea>"+btn)}
function cp(){var e=$("bx");e.select();try{navigator.clipboard.writeText(e.value).then(function(){toast("Скопійовано")},function(){toast("Утримуйте текст і виберіть «Скопіювати»")})}catch(x){toast("Утримуйте текст і виберіть «Скопіювати»")}}
function csv(){var r=["Дата;Тип;Сума;Магазин;Категорія;Нотатка"].concat(S.ex.sort(function(a,b){return a.d<b.d?-1:1}).map(function(x){return[x.d,x.k=="i"?"дохід":"витрата",x.a,x.s,cat(x.c).n,x.t].map(function(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(";")}));box("Експорт CSV",r.join("\n"),'<button class="p" onclick="cp()">Скопіювати</button><div class="mu">Вставте в Нотатки або у Google Таблиці.</div>')}
function bk(){box("Резервна копія",JSON.stringify(S),'<button class="p" onclick="cp()">Скопіювати</button><div class="mu">Збережіть цей текст у надійному місці (наприклад, у захищеній нотатці).</div>')}
function rs(){box("Відновлення","",'<div class="mu">Вставте текст резервної копії. Поточні дані буде замінено.</div><button class="p" onclick="try{var v=JSON.parse($(\'bx\').value);if(!v.cats||!v.ex)throw 0;S=v;save();cl();render();toast(\'Відновлено\')}catch(e){toast(\'Невірний формат\')}">Відновити</button>')}
function wipe(){sheet('<h2>Стерти всі дані?</h2><p class="mu">Це незворотно. Спершу зробіть резервну копію.</p><button class="p" onclick="try{localStorage.removeItem(\'mb1\')}catch(e){}location.reload()">Так, стерти</button> <button class="g" onclick="cl()">Скасувати</button>')}
render();
</script></body></html>
