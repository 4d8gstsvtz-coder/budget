function budSheet(){sheet('<h2>Бюджет на місяць</h2><input id="bb" type="number" inputmode="decimal" value="'+(S.b||"")+'" placeholder="Сума, ₴"><button class="p" onclick="S.b=+$(\'bb\').value||0;save();cl();render()">Зберегти</button>')}
var man=0;
function parse(t){t=t.replace(/['`ʼ]/g,"’");var o={a:"",s:"",c:"oth",d:td(),sure:0},l=t.toLowerCase();

if(m){var n=parseFloat((m[1]!==undefined?m[1]:m[0]).replace(/\s/g,"").replace(",","."));if(n>0)o.a=n}
if(/вчора/.test(l)){var y=new Date();y.setDate(y.getDate()-1);o.d=y.getFullYear()+"-"+p2(y.getMonth()+1)+"-"+p2(y.getDate())}
var st0=(m?t.replace(m[0],""):t).replace(/вчора|сьогодні/ig,""),stem=null;
S.cats.forEach(function(c){if(o.sure)return;var n=c.n.toLowerCase();if(n.length<3)return;var st=n.length>4?n.slice(0,-1):n;if(l.indexOf(st)>-1){o.c=c.id;o.sure=1;stem=st}});
if(!o.sure)for(var k in KW)if(!o.sure&&S.cats.some(function(c){return c.id==k})&&KW[k].split(" ").some(function(w){return l.indexOf(w)>-1})){o.c=k;o.sure=1}
var W=st0.split(/[^A-Za-zА-Яа-яІіЇїЄєҐґ0-9’-]+/).filter(Boolean).filter(function(w){return!(stem&&w.toLowerCase().indexOf(stem)==0)&&!/^(грн|uah|гривень|гривні)$/i.test(w)});
o.s=W[0]||"";return o}
function auto(){if(man)return;var v=$("qt").value.trim();if(!v)return;var o=parse(v),c=o.sure?o.c:"oth";$("fa").value=o.a;$("fs").value=o.s;$("fd").value=o.d;if(S.cats.some(function(x){return x.id==c}))$("fc").value=c}
function addSheet(e){var x=e||{};man=0;sheet('<h2>'+(x.id?"Редагувати":"Нова витрата")+"</h2>"+'<div id="ph"></div>'+(x.id?"":'<label class="mu">Швидкий запис текстом (поля заповняться самі)</label><input id="qt" placeholder="330 грн, продукти" oninput="auto()" onchange="fill()"><button class="g" onclick="fill()">Розпізнати текст</button> <label style="display:inline-block;background:var(--ln);padding:10px 14px;border-radius:14px;margin-top:6px">📷 Фото чека<input type="file" accept="image/*" hidden onchange="ocrFile(this.files[0])"></label><div class="mu">Перевірте поля нижче перед збереженням.</div>')+
(S.inc?'<select id="fk"><option value="e">Витрата</option><option value="i"'+(x.k=="i"?" selected":"")+">Дохід</option></select>":"")+
'<input id="fa" oninput="man=1" type="number" inputmode="decimal" placeholder="Сума, ₴" value="'+(x.a||"")+'"><input id="fd" type="date" value="'+(x.d||td())+'"><input id="fs" oninput="man=1" placeholder="Магазин / назва" value="'+esc(x.s||"")+'">'+sel("fc",x.c||"prod")+'<input id="fn" placeholder="Нотатка (необов’язково)" value="'+esc(x.t||"")+'">'+
'<button class="p" onclick="saveEx(\''+(x.id||"")+'\')">Зберегти</button> '+(x.id?'<button class="g" onclick="delEx(\''+x.id+'\')">Видалити</button>':"")+(x.raw?'<details style="margin-top:10px"><summary class="mu">Розпізнаний текст</summary><pre style="white-space:pre-wrap;font-size:12px">'+esc(x.raw)+"</pre></details>":""));showPh(x)}
function fill(){man=0;auto();toast(parse($("qt").value).sure?"Розпізнано. Перевірте поля":"Категорію не вгадано — оберіть вручну")}
var dupOK=0;function saveEx(id){var a=+$("fa").value;if(!(a>0))return toast("Вкажіть суму більше 0");
var o={id:id||uid(),a:a,d:$("fd").value||td(),s:$("fs").value.trim(),c:$("fc").value,t:$("fn").value.trim(),k:S.inc&&$("fk").value=="i"?"i":"e"},old=id?S.ex.filter(function(x){return x.id==id})[0]:null;if(old&&old.r)o.r=old.r;if(pend||(old&&old.ph))o.ph=1;

dupOK=0;if(pend)pset(o.id,pend);if(id)S.ex=S.ex.map(function(x){return x.id==id?o:x});else S.ex.push(o);save();cl();render()}

V.hist=function(){var ms=[];S.ex.forEach(function(x){var m=x.d.slice(0,7);if(ms.indexOf(m)<0)ms.push(m)});ms.sort().reverse();
return'<h1>Історія</h1><input id="hq" placeholder="🔍 Пошук" oninput="hl()"><div class="r"><select id="hc" onchange="hl()"><option value="">Усі категорії</option>'+S.cats.map(function(c){return'<option value="'+c.id+'">'+c.e+" "+esc(c.n)+"</option>"}).join("")+'</select><select id="hm" onchange="hl()"><option value="">Усі місяці</option>'+ms.map(function(m){return'<option value="'+m+'">'+mon(m)+"</option>"}).join("")+'</select></div><div class="c" id="hlst"></div>'};

var V6=M.map(function(m){return sum(m)}),mx=Math.max.apply(null,V6.concat([1])),cur=M[5],pv=M[4];

h+='<div class="c"><div class="mu">Цей місяць проти минулого</div>';var any=0;

function readReceipt(t){var L=t.split(/\n/).map(function(x){return x.trim()}).filter(Boolean),o={d:td(),a:"",s:"",c:"oth",t:"З фото (перевірте)",raw:t};
